<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Editorial &amp; Layout Design — Gil Tejano Culas, creative specialist." />
    <title>Editorial &amp; Layout Design | Gil Tejano Culas</title>
    <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/project-gallery.css" />
    <link rel="stylesheet" href="../css/gallery-editorial.css" />
    <script src="../js/gallery-categories-data.js" defer></script>
    <script src="../js/gallery-editorial-manifest.js" defer></script>
    <script src="../js/gallery-editorial-meta.js" defer></script>
    <script src="../js/gallery-editorial.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="nav-backdrop" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Gil Tejano Culas, home">
        <img class="brand-mark" src="../assets/icons/logo.png" alt="" aria-hidden="true" />
        <span class="brand-name">Gil Tejano Culas</span>
      </a>

      <div class="header-controls">
        <nav class="floating-nav" id="primary-nav" aria-label="Primary navigation">
          <a href="../index.html#work">Work</a>
          <a href="../index.html#gallery">Gallery</a>
          <a href="../index.html#about">About</a>
          <a href="../index.html#capabilities">Capabilities</a>
          <a href="mailto:giltejano.visuals@gmail.com">Contact</a>
        </nav>

        <button
          class="theme-toggle"
          type="button"
          aria-pressed="false"
          aria-label="Switch to dark mode"
          data-tooltip="Switch to dark mode"
        >
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>

        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          <span>Menu</span>
          <span class="menu-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="project" id="main-content">
      <header class="project-header">
        <p class="section-index" id="category-eyebrow">Category 01 — Project Gallery</p>
        <h1 class="project-headline" id="category-title">—</h1>
        <p class="project-overview" id="category-intro">—</p>
      </header>

      <section class="editorial-wall" id="editorial-wall" aria-label="Editorial and layout design gallery, scrolls automatically and can be dragged or swiped">
        <div class="editorial-row" id="editorial-row-0">
          <div class="editorial-row-track" id="editorial-row-track-0"></div>
        </div>
        <div class="editorial-row" id="editorial-row-1">
          <div class="editorial-row-track" id="editorial-row-track-1"></div>
        </div>
        <div class="editorial-row" id="editorial-row-2">
          <div class="editorial-row-track" id="editorial-row-track-2"></div>
        </div>
      </section>

      <section class="project-closing">
        <p class="project-closing-label" id="category-closing-label">—</p>
        <p class="project-closing-text" id="category-closing-text">—</p>
        <a class="project-overview-link" href="../index.html#gallery">
          <span aria-hidden="true">←</span> Back to Project Gallery
        </a>
      </section>
    </main>

    <p class="project-counter" id="project-counter" aria-hidden="true">01 / 05</p>

    <nav class="brand-nav" aria-label="Project Gallery categories">
      <a class="brand-nav-link" id="brand-nav-prev" href="#">
        <span class="brand-nav-label-full">← Previous Category</span>
        <span class="brand-nav-label-short">← Prev</span>
      </a>
      <span class="brand-nav-divider" aria-hidden="true"></span>
      <a class="brand-nav-link brand-nav-link-home" href="../index.html#gallery">
        <span class="brand-nav-label-full">Project Gallery</span>
        <span class="brand-nav-label-short">Gallery</span>
      </a>
      <span class="brand-nav-divider" aria-hidden="true"></span>
      <a class="brand-nav-link" id="brand-nav-next" href="#">
        <span class="brand-nav-label-full">Next Category →</span>
        <span class="brand-nav-label-short">Next →</span>
      </a>
    </nav>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Fullscreen image preview">
      <div class="lightbox-stage" id="lightbox-stage"></div>

      <button class="lightbox-zone lightbox-zone-prev" type="button" aria-label="Show previous image"></button>
      <button class="lightbox-zone lightbox-zone-next" type="button" aria-label="Show next image"></button>

      <button class="lightbox-close" type="button" aria-label="Close fullscreen preview">
        <span aria-hidden="true">×</span>
      </button>

      <div class="lightbox-caption" id="lightbox-caption"></div>

      <p class="lightbox-counter" aria-live="polite">
        <span id="lightbox-current">01</span><span aria-hidden="true"> / </span><span id="lightbox-total">01</span>
      </p>
    </div>
  </body>
</html>
