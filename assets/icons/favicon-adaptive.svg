<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Adaptive favicon: the GT mark (as an alpha mask) filled with a colour
       that follows the browser's colour scheme: deep teal on light tab
       strips, light paper on dark ones. Browsers without SVG favicons
       (Safari) use favicon.png instead. -->
  <style>
    .mark { fill: #0f4c4c; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f2f0ea; } }
  </style>
  <mask id="gt" style="mask-type: alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <image width="128" height="128" href="data:image/png;base64," />
  </mask>
  <rect class="mark" width="128" height="128" mask="url(#gt)" />
</svg>